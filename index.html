<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>چاچی</title>
<meta name="theme-color" content="#F6F9FC">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="چاچی">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Farsi-Complete-Font-faces.css" rel="stylesheet" type="text/css" />
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">💧</div>
      <div class="brand-text">
        <h1>چاچی</h1>
        <p id="subtitle">یادآورهای خودت</p>
      </div>
    </div>
    <button class="icon-btn" id="permBtn" title="اعلان‌ها">🔔</button>
  </div>

  <div id="permBanner" class="perm-banner" style="display:none">
    <p>برای اینکه چاچی بتونه بهت یادآوری بده، اجازه‌ی نوتیفیکیشن رو فعال کن.</p>
    <button id="permAllow">فعال کن</button>
  </div>

  <div id="emptyState" class="empty" style="display:none">
    <div class="emoji">🫧</div>
    <h2>هنوز یادآوری نساختی</h2>
    <p>با دکمه‌ی + یه یادآوری بساز، یا از پیشنهادهای زیر شروع کن</p>
    <div class="suggest-title">پیشنهاد چاچی</div>
    <div class="chips" id="suggestChips"></div>
  </div>

  <div class="list" id="list"></div>
</div>

<button class="fab" id="fabAdd">+</button>

<!-- Add / Edit sheet -->
<div class="sheet-overlay" id="overlay"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <h2 id="sheetTitle">یادآوری جدید</h2>

  <div class="field">
    <label>عنوان</label>
    <input type="text" id="fTitle" placeholder="مثلاً آب بخور" maxlength="40">
  </div>

  <div class="field">
    <label>توضیح کوتاه (اختیاری)</label>
    <input type="text" id="fMsg" placeholder="مثلاً یه لیوان آب سر بکش" maxlength="60">
  </div>

  <div class="field">
    <label>آیکون</label>
    <div class="emojis" id="emojiPick"></div>
  </div>

  <div class="field">
    <label>رنگ</label>
    <div class="swatches" id="colorPick"></div>
  </div>

  <div class="field">
    <label>نوع زمان‌بندی</label>
    <div class="seg" id="modeSeg">
      <button data-mode="interval" class="active">تکرار فاصله‌ای</button>
      <button data-mode="time">ساعت مشخص</button>
    </div>
  </div>

  <div id="intervalBlock">
    <div class="field">
      <label>هر چند دقیقه یک‌بار یادآوری کنه</label>
      <input type="number" id="fInterval" min="1" placeholder="مثلاً 90" value="90">
    </div>
    <div class="switch-row">
      <span>محدود به یک بازه‌ی زمانی خاص از روز</span>
      <div class="switch" id="rangeSwitch"><div class="knob"></div></div>
    </div>
    <div id="rangeBlock" style="display:none">
      <div class="row2">
        <div class="field">
          <label>از ساعت</label>
          <input type="time" id="fRangeStart" value="08:00">
        </div>
        <div class="field">
          <label>تا ساعت</label>
          <input type="time" id="fRangeEnd" value="23:00">
        </div>
      </div>
    </div>
  </div>

  <div id="timeBlock" style="display:none">
    <label style="display:block;font-size:12.5px;color:var(--muted);margin-bottom:8px">ساعت‌های یادآوری (مثل آلارم)</label>
    <div class="time-list" id="timeList"></div>
    <button class="link-btn" id="addTimeBtn">+ افزودن ساعت</button>
  </div>

  <div class="sheet-actions" style="margin-top:20px">
    <button class="btn btn-danger" id="deleteBtn" style="display:none">حذف</button>
    <button class="btn btn-ghost" id="cancelBtn">انصراف</button>
    <button class="btn btn-primary" id="saveBtn">ذخیره</button>
  </div>
</div>

<div class="banner-layer" id="bannerLayer"></div>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
